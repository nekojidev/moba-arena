<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="body" cx="35%" cy="35%" r="75%">
      <stop offset="0" stop-color="#b7ffe3"/>
      <stop offset="0.55" stop-color="#3fd6a3"/>
      <stop offset="1" stop-color="#1f8f6a"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7ef0ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7ef0ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- тло кольору гри й коло арени -->
  <rect width="512" height="512" rx="96" fill="#0b100d"/>
  <circle cx="256" cy="256" r="200" fill="#101a14" stroke="#2f4a39" stroke-width="6"/>
  <circle cx="256" cy="256" r="168" fill="none" stroke="#1d2f24" stroke-width="3" stroke-dasharray="6 14"/>

  <!-- герой: круглий зелений маг у плащі, вигляд згори, з посохом -->
  <g transform="translate(226 232) rotate(-14) scale(6.4)">
    <polygon points="6,-15 -24,-11 -17,0 -24,11 6,15" fill="#1f8f6a" stroke="#14604a" stroke-width="1.5" stroke-linejoin="round"/>
    <polygon points="2,-9 -18,-7 -13,0 -18,7 2,9" fill="#14604a" opacity="0.6"/>
    <circle cx="0" cy="-12" r="4.5" fill="#14604a"/>
    <circle cx="0" cy="12" r="4.5" fill="#14604a"/>
    <circle r="13" fill="url(#body)" stroke="#14604a" stroke-width="1.2"/>
    <circle cx="5" cy="0" r="6" fill="#e6fff5"/>
    <circle cx="7.5" cy="-2.2" r="1.2" fill="#1b2a22"/>
    <circle cx="7.5" cy="2.2" r="1.2" fill="#1b2a22"/>
    <line x1="-8" y1="17" x2="24" y2="17" stroke="#c9a25a" stroke-width="3" stroke-linecap="round"/>
    <circle cx="27" cy="17" r="11" fill="url(#glow)"/>
    <circle cx="27" cy="17" r="5" fill="#7ef0ff" stroke="#e8fdff" stroke-width="1"/>
  </g>
</svg>
