<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MOBA Arena</title>
    <meta
      name="description"
      content="Мережева арена для кількох гравців у браузері. Потрібні клавіатура та з'єднання із сервером."
    />
    <!-- PWA: маніфест, колір рамки вікна, іконки. Service worker реєструє src/pwa.ts. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0b100d" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Arena" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b100d;
        overflow: hidden;
        font-family: ui-monospace, Menlo, Consolas, monospace;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      [hidden] {
        display: none !important;
      }
      nav {
        position: fixed;
        right: 12px;
        top: 12px;
        display: flex;
        gap: 6px;
        font-size: 12px;
      }
      nav a {
        color: #cfe8d6;
        background: rgba(10, 16, 12, 0.75);
        border: 1px solid #2f4a39;
        border-radius: 4px;
        padding: 4px 8px;
        text-decoration: none;
      }
      nav a.active {
        border-color: #f2c14e;
        color: #f2c14e;
      }
      button {
        font: inherit;
        cursor: pointer;
      }
      .loading-button {
        position: fixed;
        left: 50%;
        top: calc(50% + 24px);
        transform: translateX(-50%);
        padding: 8px 18px;
        border-radius: 6px;
        border: 1px solid #2f4a39;
        background: #16241b;
        color: #cfe8d6;
        font-size: 14px;
      }
      #loading-retry {
        border-color: #f2c14e;
        color: #f2c14e;
      }
      #lobby {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgba(11, 16, 13, 0.92);
        color: #d7f5df;
      }
      #lobby form {
        width: min(460px, calc(100vw - 32px));
        display: grid;
        gap: 12px;
      }
      #lobby h1 {
        margin: 0;
        font-size: 28px;
      }
      #lobby h2 {
        margin: 6px 0 0;
        font-size: 13px;
        font-weight: normal;
        color: #9fc7ab;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      #lobby label {
        display: grid;
        gap: 4px;
        font-size: 13px;
        color: #9fc7ab;
      }
      #lobby input {
        font: inherit;
        font-size: 16px;
        padding: 8px 10px;
        border-radius: 6px;
        border: 1px solid #2f4a39;
        background: #0f1813;
        color: #d7f5df;
      }
      #lobby .rooms {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 6px;
        min-height: 60px;
      }
      #lobby .room {
        width: 100%;
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 2px 12px;
        text-align: left;
        padding: 10px 12px;
        border-radius: 6px;
        border: 1px solid #2f4a39;
        background: #0f1813;
        color: #d7f5df;
      }
      #lobby .room span {
        grid-column: 1;
        font-size: 12px;
        color: #7d9886;
      }
      #lobby .room em {
        grid-column: 2;
        grid-row: 1 / span 2;
        align-self: center;
        font-style: normal;
        color: #9fc7ab;
      }
      #lobby .room.selected {
        border-color: #3fd6a3;
        background: #16241b;
      }
      #lobby .room.full em {
        color: #e2574c;
      }
      #lobby .status {
        margin: 0;
        min-height: 1.3em;
        font-size: 12px;
        color: #7d9886;
      }
      #lobby .status.error {
        color: #ff9a8a;
      }
      #lobby button[type='submit'] {
        padding: 10px;
        border-radius: 6px;
        border: 1px solid #3fd6a3;
        background: #3fd6a3;
        color: #0b100d;
        font-size: 16px;
        font-weight: bold;
      }
      #lobby .create {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 6px;
      }
      #lobby .create input {
        font-size: 13px;
        padding: 6px 10px;
      }
      #lobby button.secondary {
        padding: 6px 12px;
        border-radius: 6px;
        border: 1px solid #2f4a39;
        background: #16241b;
        color: #cfe8d6;
        font-size: 13px;
      }
      #chat {
        position: fixed;
        right: 12px;
        bottom: 12px;
        width: 280px;
        display: grid;
        gap: 6px;
        padding: 10px;
        border-radius: 6px;
        border: 1px solid #2f4a39;
        background: rgba(8, 14, 10, 0.82);
        color: #d7f5df;
        font-size: 12px;
      }
      #chat h2 {
        margin: 0;
        font-size: 13px;
      }
      #chat ul,
      #chat ol {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      #chat .roster {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      #chat .roster li {
        padding: 1px 6px;
        border-radius: 10px;
        background: #16241b;
        color: #9fc7ab;
      }
      #chat .roster li.me {
        color: #3fd6a3;
      }
      #chat .net {
        margin: 0;
        color: #7d9886;
      }
      #chat .net.bad {
        color: #f2c14e;
      }
      #chat .log {
        height: 120px;
        overflow-y: auto;
        display: grid;
        align-content: start;
        gap: 2px;
        overflow-wrap: anywhere;
      }
      #chat .log .system {
        color: #7d9886;
      }
      #chat .log .mine {
        color: #9fe8c9;
      }
      #chat input {
        width: 100%;
        box-sizing: border-box;
        font: inherit;
        padding: 5px 8px;
        border-radius: 4px;
        border: 1px solid #2f4a39;
        background: #0f1813;
        color: #d7f5df;
      }
      #lobby button[type='submit']:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <button id="loading-cancel" class="loading-button" hidden>Скасувати</button>
    <button id="loading-retry" class="loading-button" hidden>Спробувати ще раз</button>
    <div id="lobby" hidden></div>
    <aside id="chat" hidden></aside>
    <nav id="modes" hidden>
      <a href="./">лобі</a>
      <a href="?exp=block">exp 1: блок 100 мс</a>
      <a href="?exp=interval">exp 2: setInterval</a>
      <a href="?bench">exp 3: fixed + bench</a>
      <a href="?exp=variable&bench">exp 3: variable + bench</a>
    </nav>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
