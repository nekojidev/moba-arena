name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Vite і Node лише стирають типи й нічого не перевіряють — перевіряє саме цей крок.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
