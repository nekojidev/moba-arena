name: CI

on:
  push:
    branches: [main]
  pull_request:

# Новий коміт у ту саму гілку чи PR скасовує попередній запуск: його результат уже нікому не потрібен.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint, test, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Vite і Node лише стирають типи й нічого не перевіряють — перевіряє саме цей крок.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build client
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Playwright сам піднімає сервер (webServer у playwright.config.ts) і чекає на /health.
      - name: End-to-end tests
        run: npm run e2e

      - name: Upload Playwright report and traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
