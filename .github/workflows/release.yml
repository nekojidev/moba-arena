name: Release

# Тег v* (наприклад, v0.8.0) → образ у GitHub Container Registry:
#   ghcr.io/nekojidev/moba-arena:<тег>  і  :latest
#
#   git tag v0.8.0 && git push origin v0.8.0
#
# Тег ставте на коміт із main, який уже пройшов CI (ci.yml перевіряє кожен push і PR):
# тут тести не повторюються, лише збирається образ і перевіряється, що він запускається.

on:
  push:
    tags: ['v*']

# Два релізи одного тегу одночасно не потрібні; розпочатий реліз не скасовуємо.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/nekojidev/moba-arena

jobs:
  image:
    name: Build and push image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # дозволяє GITHUB_TOKEN публікувати в GHCR
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Окремий токен не потрібен: GITHUB_TOKEN живе лише під час цього запуску.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      # Спершу збираємо образ локально й перевіряємо його, і лише потім публікуємо:
      # зламаний образ не повинен отримати тег latest.
      - name: Build image for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: moba-arena:smoke
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (health, version, non-root, graceful stop)
        run: |
          docker run -d --name smoke -p 3000:3000 \
            -e ALLOWED_ORIGINS=http://localhost:3000 moba-arena:smoke
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:3000/health > health.json; then break; fi
            sleep 1
          done
          cat health.json
          test "$(jq -r .version health.json)" = "${{ github.sha }}"
          test "$(docker exec smoke id -u)" != "0"
          docker stop smoke
          docker logs smoke | tail -n 5
          test "$(docker inspect --format '{{.State.ExitCode}}' smoke)" = "0"

      # Шари вже в кеші GHA, тож цей крок лише публікує зібране вище.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha

  # ----------------------------------------------------------------------------------
  # ЗАГЛУШКА. Розгортання ще НЕ налаштоване: цей job нічого не розгортає.
  # Доки змінної репозиторію DEPLOY_ENABLED немає (або вона не 'true'), job пропускається
  # і реліз закінчується на публікації образу.
  #
  # Щоб увімкнути розгортання на Fly.io:
  #   1. Один раз локально: `fly launch --no-deploy` — з'явиться fly.toml. У ньому:
  #        [http_service] internal_port = 3000, force_https = true,
  #          auto_stop_machines = "off"      # гра тримає стан у пам'яті
  #        [[http_service.checks]] method = "GET", path = "/health"
  #        kill_signal = "SIGTERM", kill_timeout = 15
  #        [env] ALLOWED_ORIGINS = "https://<застосунок>.fly.dev", TRUST_PROXY = "1"
  #      Закомітьте fly.toml.
  #   2. Пакунок ghcr.io/nekojidev/moba-arena зробіть публічним (Package settings →
  #      Change visibility), інакше Fly не зможе завантажити образ.
  #   3. Settings → Secrets and variables → Actions:
  #        секрет   FLY_API_TOKEN   — вивід `fly tokens create deploy`
  #        змінна   PUBLIC_URL      — https://<застосунок>.fly.dev (без «/» в кінці)
  #        змінна   DEPLOY_ENABLED  — true
  #   4. Замініть крок «Deployment is not configured» нижче на закоментовані кроки.
  # ----------------------------------------------------------------------------------
  deploy:
    name: Deploy (placeholder, not configured)
    needs: image
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Чесне повідомлення замість удаваного розгортання; реліз через нього не падає.
      - name: Deployment is not configured
        run: |
          echo "::warning title=Deploy skipped::DEPLOY_ENABLED=true, but the deploy job in release.yml is still a placeholder. Nothing was deployed."
          echo "Published image: ${IMAGE}:${GITHUB_REF_NAME}"

